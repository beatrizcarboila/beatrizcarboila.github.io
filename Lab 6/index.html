<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cromos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Coleção de Cromos</h1>
    </header>
    <main>
      <section id="colecao">
        <h2>A minha coleção</h2>
        <ul id="lista-cromos"></ul>
        <h3>Total de cromos: <span id="total-cromos">0</span></h3>
      </section>
      <section>
        <h2>Registar novo cromo</h2>
        <form id="form-cromo">
          <input
            type="number"
            id="input-numero"
            placeholder="número"
            required
          />
          <button type="submit" autofocus>Registar Cromo</button>
        </form>
      </section>
    </main>
    <footer>2026, ULusófona</footer>

    <script src="script.js"></script>
  </body>
</html>
