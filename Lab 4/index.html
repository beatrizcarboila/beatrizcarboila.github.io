<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Laboratório 4 - Emoções e Humor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="piada">
        <p id="textopiada">Passa o rato por aqui</p>
      </section>

      <section id="emoções">
        <p>Escolhe a tua emoção:</p>
        <button type="button" id="alegria">Alegria</button>
        <button type="button" id="tristeza">Tristeza</button>
        <button type="button" id="medo">Medo</button>
        <button type="button" id="nojo">Nojo</button>
        <button type="button" id="raiva">raiva</button>
        <button type="button" id="ansiedade">Ansiedade</button>
        <button type="button" id="inveja">Inveja</button>
        <button type="button" id="tedio">Tedio</button>
        <button type="button" id="vergonha">Vergonha</button>
      </section>

      <section id="caixa-section">
        <p>Escreve algo e vê o que acontece...🤭</p>
        <input type="text" id="caixa" placeholder="escreve aqui" />
      </section>

      <section id="conta">
        <button type="button" id="riso">Conta risos</button>
        <span id="numero">0</span>
      </section>

      <section id="imagem">
        <img
          src="fotografia.png"
          id="fotografia"
          alt="Fotografia ilustrativa"
          width="100"
        />
      </section>
    </main>

    <footer>
      <p>Feito com muito bom humor :D</p>
    </footer>

    <a href=".../index.html">Landing page</a>
    <script src="main.js"></script>
  </body>
</html>
