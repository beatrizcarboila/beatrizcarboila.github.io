<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Função 1. -->
    <div class="bloco">
      <p id="texto-hover">Passa por aqui!</p>
    </div>

    <!-- Função 2. -->
    <div class="bloco">
      <p id="pinta-me">2. Pinta-me!</p>
      <button type="button" class="color" data-color="red">Red</button>
      <button type="button" class="color" data-color="green">Green</button>
      <button type="button" class="color" data-color="blue">Blue</button>
      <button type="button" class="color" data-color="pink">Rosa bebé</button>
      <button type="button" class="color" data-color="lightblue">
        Azul bebé
      </button>
    </div>

    <!-- Função 3. -->
    <div class="bloco">
      <label for="caixa-cor">3. Experienta escrever...</label>
      <input type="text" id="caixa-cor" />
    </div>

    <!-- Função 4. -->
    <div class="bloco">
      <label for="select-cor-site">4. Escolha uma cor:</label>
      <select id="select-cor-site">
        <option value="">Selecione...</option>
        <option value="white">Branco</option>
        <option value="lightblue">Azul</option>
        <option value="lightgreen">Verde</option>
        <option value="lightyellow">Amarelo</option>
      </select>
    </div>

    <!-- Função 5. Conta -->
    <div class="bloco">
      <h3>Contador Manual</h3>
      <h1 id="contador-valor">0</h1>
      <button type="button" id="btn-incrementar">Incrementar</button>
      <button type="button" id="btn-decrementar">Decrementar</button>
      <button type="button" id="btn-reset">Reset</button>
    </div>

    <!-- Função 6. Formulário Nome e Idade -->
    <div class="bloco">
      <form id="form-utilizador">
        <input id="nome" type="text" placeholder="Insira o seu nome" />
        <input id="idade" type="number" placeholder="Insira a sua idade" />
        <button type="submit">Submeter</button>
      </form>
      <p id="mensagem-utilizador"></p>
    </div>

    <!-- Função 7.: Temporizador Automático (setInterval) -->
    <div class="bloco">
      <h3>Temporizador Automático (1 em 1 segundo)</h3>
      <h1 id="temporizador-valor">0</h1>
    </div>

    <!--Select flex-->
    <div class="bloco">
      <label for="select-flex">Select Flex (Direção):</label>
      <select id="select-flex">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>

      <div id="flex-container">
        <div class="bola bola-vermelha"></div>
        <div class="bola bola-azul"></div>
        <div class="bola bola-verde"></div>
        <div class="bola bola-laranja"></div>
      </div>
    </div>

    <footer>
      <p>Universidade Lusófona 2026</p>
    </footer>

    <!--Para usar o js-->
    <script src="main.js"></script>
  </body>
</html>
